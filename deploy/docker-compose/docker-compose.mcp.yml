version: '2'

services:
  sockshop-mcp:
    build:
      context: ../../sockshop-mcp
      dockerfile: Dockerfile
    hostname: sockshop-mcp
    restart: always
    environment:
      - SOCKSHOP_BASE_URL=http://edge-router:80
      - SOCKSHOP_USERNAME=user
      - SOCKSHOP_PASSWORD=password
    ports:
      - '3001:3000'
    depends_on:
      - edge-router
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
